<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vereinswelt – TTV Musterhausen</title>
  <link rel="stylesheet" href="welt.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ea580c'/%3E%3C/svg%3E">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="ball"></span><div><strong>Vereinswelt</strong><small>TTV Musterhausen 1962 e. V.</small></div></div>
      <nav id="nav"></nav>
      <div class="side-foot">Alles hier ist erfunden. Nichts verlässt diesen Rechner.</div>
    </aside>
    <div class="main-wrap">
      <header class="top">
        <button class="menu" id="menu" aria-label="Menü">☰</button>
        <div class="clock"><span id="date">…</span><small id="day"></small></div>
        <div class="time-btns">
          <button data-days="1">+1 Tag</button><button data-days="3">+3 Tage</button><button data-days="7">+1 Woche</button>
          <span class="spin" id="busy" hidden></span>
        </div>
        <a class="app-link" id="applink" target="ehrenamt-app" href="#">Zur Ehrenamt-App ↗</a>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="welt.js"></script>
</body>
</html>
